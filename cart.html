<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>
  <link rel="stylesheet" href="style.css"> <!-- your existing CSS -->
  <style>
    body {
      background-color: #021a1a;
      color: #f1f7f7;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    #cart-items {
      max-width: 800px;
      margin: 0 auto 20px auto;
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 15px;
    }

    .cart-item img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid #2cc295;
    }

    .cart-item h3 {
      margin: 0 0 5px 0;
    }

    .cart-item p {
      margin: 3px 0;
    }

    #total-amount {
      font-size: 1.5rem;
      text-align: right;
      margin-top: 20px;
      font-weight: bold;
    }

    .cart-buttons {
      text-align: center;
      margin-top: 30px;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .btn {
      padding: 12px 25px;
      background: #2cc295;
      color: #fff;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: #00df82;
      color: #021a1a;
      transform: scale(1.05);
      box-shadow: 0 0 15px #00df82;
    }
  </style>
</head>
<body>

  <h1>Your Cart</h1>

  <div id="cart-items">
    <!-- Cart items will be loaded here dynamically by JS -->
  </div>

  <div id="total-amount">
    <!-- Total amount will be displayed here -->
  </div>

  <div class="cart-buttons">
    <button class="btn" onclick="clearCart()">Clear Cart</button>
    <button class="btn" onclick="alert('Proceeding to checkout...')">Checkout</button>
  </div>

  <script src="script.js"></script> <!-- your JS file with addToCart, loadCartItems, clearCart -->
  <script>
    // Load cart items when page loads
    loadCartItems();
  </script>

</body>
</html>
