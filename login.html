<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f4f2;
      --card: #ffffff;
      --border: rgba(0,0,0,0.1);
      --border-strong: rgba(0,0,0,0.15);
      --border-stronger: rgba(0,0,0,0.25);
      --text-primary: #1a1a18;
      --text-secondary: #5f5e5a;
      --text-muted: #888780;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-bg: #eff6ff;
      --accent-border: #bfdbfe;
      --surface: #f9f9f8;
      --radius: 8px;
      --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 4px 16px rgba(0,0,0,0.05);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141412;
        --card: #1e1e1c;
        --border: rgba(255,255,255,0.08);
        --border-strong: rgba(255,255,255,0.12);
        --border-stronger: rgba(255,255,255,0.22);
        --text-primary: #f0ede8;
        --text-secondary: #a8a7a2;
        --text-muted: #6b6a66;
        --accent: #3b82f6;
        --accent-hover: #60a5fa;
        --accent-bg: #1e2d4a;
        --accent-border: #1e40af;
        --surface: #181816;
        --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.25);
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .login-card {
      background: var(--card);
      border: 0.5px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: var(--shadow);
      animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-icon {
      width: 48px;
      height: 48px;
      background: var(--accent-bg);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s both;
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(0.6); }
      to   { opacity: 1; transform: scale(1); }
    }

    .login-icon i { font-size: 22px; color: var(--accent); }

    h1 {
      text-align: center;
      font-size: 20px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
      animation: fadeIn 0.4s ease 0.2s both;
    }

    .subtitle {
      text-align: center;
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 1.75rem;
      animation: fadeIn 0.4s ease 0.25s both;
    }

    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }

    .field { margin-bottom: 1rem; animation: fadeIn 0.4s ease 0.3s both; }
    .field + .field { animation-delay: 0.35s; }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .input-wrap { position: relative; display: flex; align-items: center; }

    .input-wrap .icon-left {
      position: absolute;
      left: 10px;
      font-size: 16px;
      color: var(--text-muted);
      pointer-events: none;
      transition: color 0.2s ease;
    }

    .input-wrap input {
      width: 100%;
      padding: 0 12px 0 36px;
      height: 40px;
      font-size: 14px;
      background: var(--surface);
      border: 0.5px solid var(--border-strong);
      border-radius: var(--radius);
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .input-wrap input::placeholder { color: var(--text-muted); }
    .input-wrap input:hover { border-color: var(--border-stronger); }
    .input-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-bg);
      background: var(--card);
    }
    .input-wrap:focus-within .icon-left { color: var(--accent); }

    .icon-right {
      position: absolute;
      right: 10px;
      font-size: 16px;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.15s;
      user-select: none;
    }
    .icon-right:hover { color: var(--text-primary); }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0.5rem 0 1.25rem;
      animation: fadeIn 0.4s ease 0.4s both;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
    }

    .remember input[type="checkbox"] {
      width: 15px;
      height: 15px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .forgot {
      font-size: 13px;
      color: var(--accent);
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .forgot:hover { opacity: 0.7; }

    .btn-login {
      width: 100%;
      height: 40px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: background 0.2s ease, transform 0.12s ease, box-shadow 0.2s ease;
      animation: fadeIn 0.4s ease 0.45s both;
    }

    .btn-login:hover {
      background: var(--accent-hover);
      box-shadow: 0 2px 12px rgba(37, 99, 235, 0.3);
    }

    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { opacity: 0.6; cursor: default; }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 1.25rem 0;
      animation: fadeIn 0.4s ease 0.5s both;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 0.5px;
      background: var(--border-strong);
    }
    .divider span { font-size: 12px; color: var(--text-muted); white-space: nowrap; }

    .btn-social {
      width: 100%;
      height: 40px;
      background: var(--surface);
      border: 0.5px solid var(--border-strong);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.1s ease;
      animation: fadeIn 0.4s ease 0.55s both;
    }
    .btn-social:hover {
      background: var(--card);
      border-color: var(--border-stronger);
    }
    .btn-social:active { transform: scale(0.98); }

    .signup-row {
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 1.25rem;
      animation: fadeIn 0.4s ease 0.6s both;
    }
    .signup-row a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.15s;
    }
    .signup-row a:hover { opacity: 0.7; }

    .toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--card);
      border: 0.5px solid var(--accent-border);
      border-radius: var(--radius);
      padding: 10px 16px;
      font-size: 13px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
      opacity: 0;
      white-space: nowrap;
      box-shadow: var(--shadow);
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-icon">
      <i class="ti ti-lock"></i>
    </div>

    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to your account to continue.</p>

    <div class="field">
      <label for="username">Username</label>
      <div class="input-wrap">
        <i class="ti ti-user icon-left"></i>
        <input type="text" id="username" name="username" placeholder="you@example.com" autocomplete="username" required>
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap">
        <i class="ti ti-key icon-left"></i>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
        <i class="ti ti-eye icon-right" id="togglePw" title="Show password"></i>
      </div>
    </div>

    <div class="row">
      <label class="remember">
        <input type="checkbox" id="remember"> Remember me
      </label>
      <a href="#" class="forgot">Forgot password?</a>
    </div>

    <button class="btn-login" id="loginBtn" type="button">Sign in</button>

    <div class="divider"><span>or continue with</span></div>

    <button class="btn-social" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <p class="signup-row">Don't have an account? <a href="#">Sign up</a></p>
  </div>

  <div class="toast" id="toast">
    <i class="ti ti-check"></i> Signing you in…
  </div>

  <script>
    const togglePw = document.getElementById('togglePw');
    const pwInput  = document.getElementById('password');

    togglePw.addEventListener('click', () => {
      const show = pwInput.type === 'password';
      pwInput.type = show ? 'text' : 'password';
      togglePw.className = (show ? 'ti ti-eye-off' : 'ti ti-eye') + ' icon-right';
    });

    document.getElementById('loginBtn').addEventListener('click', () => {
      const btn   = document.getElementById('loginBtn');
      const toast = document.getElementById('toast');
      btn.textContent = 'Signing in…';
      btn.disabled = true;
      toast.classList.add('show');
      setTimeout(() => {
        btn.textContent = 'Sign in';
        btn.disabled = false;
        toast.classList.remove('show');
      }, 2200);
    });
  </script>

</body>
</html>
